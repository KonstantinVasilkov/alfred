name: 'Setup Python and uv'
description: 'Install Python 3.13, uv, and sync dependencies'
runs:
  using: 'composite'
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Set up Python
      shell: bash
      run: uv python install 3.13
    - name: Install dependencies
      shell: bash
      run: uv sync
