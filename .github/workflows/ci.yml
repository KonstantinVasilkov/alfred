name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      telegram_bot: ${{ steps.changes.outputs.telegram_bot }}
      finances_api: ${{ steps.changes.outputs.finances_api }}
      llm_connectors: ${{ steps.changes.outputs.llm_connectors }}
      shared_domain: ${{ steps.changes.outputs.shared_domain }}
      shared_infra: ${{ steps.changes.outputs.shared_infra }}
      llm: ${{ steps.changes.outputs.llm }}
      root: ${{ steps.changes.outputs.root }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            telegram_bot:
              - 'apps/telegram_bot/**'
            finances_api:
              - 'apps/finances_api/**'
            llm_connectors:
              - 'apps/llm_connectors/**'
            shared_domain:
              - 'libs/shared_domain/**'
            shared_infra:
              - 'libs/shared_infra/**'
            llm:
              - 'libs/llm/**'
            root:
              - 'pyproject.toml'
              - '.github/workflows/**'

  lint-telegram-bot:
    needs: detect-changes
    if: needs.detect-changes.outputs.telegram_bot == 'true' || needs.detect-changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync
      - name: Run ruff lint
        run: uv run ruff check apps/telegram_bot
      - name: Run ruff format check
        run: uv run ruff format --check apps/telegram_bot
      - name: Run mypy
        run: uv run mypy apps/telegram_bot

  test-telegram-bot:
    needs: detect-changes
    if: needs.detect-changes.outputs.telegram_bot == 'true' || needs.detect-changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest apps/telegram_bot/tests -v

  lint-finances-api:
