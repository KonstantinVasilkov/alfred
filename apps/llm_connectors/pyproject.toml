[project]
name = "llm-connectors"
version = "0.1.0"
description = "LLM connectors module for exposing LLM functionality"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "shared-infra",
    "llm",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.13.3",
]

[tool.uv.sources]
shared-infra = { workspace = true }
llm = { workspace = true }
