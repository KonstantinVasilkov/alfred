services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alfred-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    volumes:
      - ./alfred:/app/alfred:ro
      - ./main.py:/app/main.py:ro
